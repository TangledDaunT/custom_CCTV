<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14"><title>CCTV · {{ hostname }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="CCTV dashboard"><span>◉</span> CCTV</a>
    <div class="topbar-right"><span class="status-dot" id="connection-dot"></span><span id="connection-label">Connecting</span>
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="text-button">Sign out</button></form>
    </div>
  </header>
  <main class="app-shell">
    <section class="hero" aria-labelledby="live-title">
      <div class="section-heading"><div><p class="eyebrow">{{ hostname }}</p><h1 id="live-title">Live view</h1></div><span class="live-pill"><i></i> LIVE</span></div>
      <div class="video-frame"><img id="feed" src="{{ url_for('video_feed') }}" alt="Live CCTV camera feed"></div>
      <div class="quick-actions">
        {% if user.role in ['operator', 'admin'] %}
        <button class="button danger" id="stop-alerts">Pause alerts</button>
        <button class="button success" id="start-alerts">Enable alerts</button>
        <button class="button secondary" id="reset-background">Reset detection</button>
        {% endif %}
      </div>
    </section>
    <section class="status-grid" aria-label="System status">
      <article class="status-card"><span>Alerts</span><strong id="alert-state">—</strong><small id="schedule-state">Checking schedule</small></article>
      <article class="status-card"><span>Activity</span><strong id="motion-state">—</strong><small id="score-state">Motion score —</small></article>
      <article class="status-card"><span>Events</span><strong id="event-count">—</strong><small>Since service start</small></article>
      <article class="status-card"><span>Camera</span><strong id="camera-state">—</strong><small id="frame-count">— frames processed</small></article>
    </section>
    <section class="events-section" aria-labelledby="events-title">
      <div class="section-heading"><div><p class="eyebrow">RECORDINGS</p><h2 id="events-title">Recent events</h2></div><button class="text-button" id="refresh-events">Refresh</button></div>
      <div class="events-grid" id="events" aria-live="polite"><p class="empty-state">Loading protected recordings…</p></div>
    </section>
  </main>
  <dialog id="player-dialog" class="player-dialog"><button class="close-button" aria-label="Close video">×</button><video id="event-player" controls playsinline></video><p id="player-caption"></p></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>window.CCTV = {csrfToken: {{ csrf_token|tojson }}, canOperate: {{ (user.role in ['operator', 'admin'])|tojson }} };</script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>

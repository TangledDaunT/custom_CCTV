<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CCTV</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#0b0e14;color:#f1f5f9;font:15px/1.5 system-ui,sans-serif}.auth-card{width:min(100%,400px);padding:32px;box-sizing:border-box;background:#121722;border:1px solid #273246;border-radius:18px}.brand-mark{color:#42e8a7;font-size:28px}.eyebrow{font-size:.7rem;letter-spacing:.14em;font-weight:700;color:#94a3b8;margin:0 0 4px}.auth-card h1{margin:0}.muted{color:#94a3b8}.login-form{display:grid;gap:16px;margin-top:26px}.login-form label{display:grid;gap:6px;font-weight:600}.login-form input{min-height:44px;border:1px solid #273246;border-radius:8px;background:#0d111a;color:#f1f5f9;padding:0 11px;font:inherit}.button{min-height:44px;border:0;border-radius:9px;background:#42e8a7;color:#052416;font-weight:700;cursor:pointer}.form-error{margin-top:16px;padding:10px;border-radius:8px;background:#4a1721;color:#ffdce1}</style>
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="title">
    <div class="brand-mark" aria-hidden="true">◉</div>
    <p class="eyebrow">PRIVATE SECURITY</p><h1 id="title">CCTV Control</h1>
    <p class="muted">Sign in to view your protected cameras.</p>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="login-form">
      <label>Username<input name="username" autocomplete="username" required autofocus maxlength="64"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>

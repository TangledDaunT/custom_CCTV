<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · CCTV</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#0b0e14;color:#f1f5f9;font:15px/1.5 system-ui,sans-serif}.auth-card{width:min(100%,420px);padding:32px;box-sizing:border-box;background:#121722;border:1px solid #273246;border-radius:18px}.muted{color:#94a3b8}.form{display:grid;gap:14px;margin-top:18px}.form label{display:grid;gap:6px;font-weight:600}.form input{min-height:44px;border:1px solid #273246;border-radius:8px;background:#0d111a;color:#f1f5f9;padding:0 11px;font:inherit}.button{min-height:44px;border:0;border-radius:9px;background:#42e8a7;color:#052416;font-weight:700;cursor:pointer}.form-error{margin-top:12px;padding:10px;border-radius:8px;background:#4a1721;color:#ffdce1}</style>
</head>
<body>
  <main class="auth-card">
    <h1>Change your password</h1>
    <p class="muted">Hi {{ user.display_name }}. Use a password with at least 8 characters and one number.</p>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>New password<input name="new_password" type="password" autocomplete="new-password" required></label>
      <label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" required></label>
      <button type="submit" class="button">Update password</button>
    </form>
  </main>
</body>
</html>
